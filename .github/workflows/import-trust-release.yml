name: Import tested trust content
on:
  push:
    branches: [trust-clarity-20261102]
    paths: [.github/workflows/import-trust-release.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'RobertAlcor/alcorv2' && github.ref == 'refs/heads/trust-clarity-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: trust-clarity-20261102
      - name: Apply checksum-verified tested source changes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 2 --max-time 30 'https://sb-3z99zwjf1jhu.vercel.run/trust-release.patch' -o /tmp/trust-release.patch
          printf '%s\n' '5a16b04299219b84dbca2460b3d91ebba990d1e880275a8efb442eef4f647cb9  /tmp/trust-release.patch' | sha256sum --check --strict
          git apply --check /tmp/trust-release.patch
          git apply --index /tmp/trust-release.patch
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'content: import tested trust, pricing clarity and inquiry improvements'
          git push origin HEAD:refs/heads/trust-clarity-20261102

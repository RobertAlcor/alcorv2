name: ALCOR preview quality check
on:
  push:
    branches: [alcor-exclusive-preview-20260929]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://webdesign-alcor.at
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.invalid
      SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder-not-a-real-key
      RESEND_API_KEY: re_ci_placeholder_not_a_real_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate website image files
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');
          (async () => {
            for (const name of fs.readdirSync('public/media')) {
              if (!name.endsWith('.webp')) continue;
              const p = `public/media/${name}`;
              const meta = await sharp(p).metadata();
              await sharp(p).raw().toBuffer();
              console.log(name, meta.width, meta.height);
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - run: npm run build
      - name: Package source without credentials or dependencies
        if: always()
        run: git archive --format=zip --output=alcor-exclusive-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alcor-exclusive-source
          path: alcor-exclusive-source.zip
          retention-days: 7

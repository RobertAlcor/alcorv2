name: ALCOR public service release check
on:
  push:
    branches: [alcor-production-check-20260930]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify public production pages without sending email
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import time
          import urllib.request
          from html.parser import HTMLParser

          release = '8a9d0bfc15ccb0eb58f7691df78223c2ed60d666'
          base = 'https://webdesign-alcor.at'
          output = pathlib.Path('live-check-results')
          output.mkdir(exist_ok=True)
          routes = ['/', '/website-service', '/website-soforthilfe', '/website-betreuung', '/kontakt', '/sitemap.xml']

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.h1 = 0
                  self.canonicals = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'h1':
                      self.h1 += 1
                  if tag == 'link' and attrs.get('rel') == 'canonical':
                      self.canonicals.append(attrs.get('href'))
                  if tag == 'a':
                      self.links.append(attrs.get('href', ''))

          results = []
          last_error = None
          for attempt in range(1, 9):
              results = []
              try:
                  for route in routes:
                      url = f'{base}{route}?release={release[:12]}&check={attempt}'
                      request = urllib.request.Request(url, headers={'User-Agent': 'ALCOR-Release-Verification/1.0', 'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          status = response.status
                          final_url = response.url
                          html = response.read().decode('utf-8')
                      assert status == 200, (route, status)
                      if route == '/sitemap.xml':
                          for service in routes[1:4]:
                              assert base + service in html, f'Missing sitemap route: {service}'
                      else:
                          page = Page()
                          page.feed(html)
                          assert page.h1 == 1, f'H1 count on {route}: {page.h1}'
                          assert '/website-service' in page.links, f'Service navigation missing on {route}'
                          if route in routes[1:4]:
                              assert base + route in page.canonicals, f'Canonical missing on {route}'
                              assert '59' in html, f'Service price missing on {route}'
                              if route != '/website-service':
                                  assert any('/kontakt?thema=' in link and '&service=' in link for link in page.links), f'Inquiry link missing on {route}'
                              (output / (route.strip('/') + '.html')).write_text(html, encoding='utf-8')
                      results.append({'route': route, 'status': status, 'url': final_url, 'contentChecks': 'PASS'})
                  last_error = None
                  break
              except Exception as error:
                  last_error = str(error)
                  print(f'Attempt {attempt}: {last_error}', flush=True)
                  if attempt < 8:
                      time.sleep(15)
          report = {'releaseCommit': release, 'baseUrl': base, 'result': 'PASS' if last_error is None else 'FAIL', 'routes': results, 'error': last_error, 'liveMail': 'NOT SENT', 'httpMethods': ['GET']}
          (output / 'report.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2), flush=True)
          if last_error is not None:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alcor-public-release-verification
          path: live-check-results/
          retention-days: 7

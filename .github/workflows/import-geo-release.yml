name: Import tested GEO source
on:
  push:
    branches: [geo-evidence-20261102]
    paths: [.github/workflows/import-geo-release.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'RobertAlcor/alcorv2' && github.ref == 'refs/heads/geo-evidence-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: geo-evidence-20261102
          fetch-depth: 2
      - name: Import exact reviewed source without executing it
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'ae9ab46e39ef18091fd7a293682bd628b3c4b780'
          curl --fail --silent --show-error --location --max-time 30 --retry 2 'https://sb-msxwfm2qa1ck.vercel.run/geo-release.patch' -o /tmp/geo-release.patch
          echo '7f12008bbf1b33e304f727aeb54c4c7942e597f0320a0bff019c3e6b9a9da77c  /tmp/geo-release.patch' | sha256sum --check --strict
          git apply --check /tmp/geo-release.patch
          git apply --index /tmp/geo-release.patch
          cp .git/index /tmp/geo-verified-index
          GIT_INDEX_FILE=/tmp/geo-verified-index git update-index --force-remove .github/workflows/import-geo-release.yml
          test "$(GIT_INDEX_FILE=/tmp/geo-verified-index git write-tree)" = 'eee3c379bf7aa94cf89ab606a79b5b4278c75a2c'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'GEO: import tested company profile, evidence links and entity consistency'
          git push origin HEAD:refs/heads/geo-evidence-20261102
